<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise RAG System</title>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400&display=swap"
        rel="stylesheet">

    <!-- Logic Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title"><i class="fas fa-layer-group"></i> Document Hub</div>
                <div class="upload-section glass-card" id="drop-zone">
                    <input type="file" id="file-upload" multiple hidden>
                    <label for="file-upload" class="upload-label">
                        <i class="fas fa-cloud-arrow-up"></i>
                        <div>
                            <div style="font-weight:600;color:var(--text-primary)">Click to Upload</div>
                            <div style="font-size:0.7rem;margin-top:4px">PDF, DOCX, TXT supported</div>
                        </div>
                    </label>
                    <div id="upload-status" style="margin-top:10px;font-size:0.8rem;color:var(--accent-primary)"></div>
                </div>
            </div>

            <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column">
                <div class="sidebar-title">
                    <i class="fas fa-file-lines"></i> Your Library
                    <span id="doc-count" class="ai-badge" style="margin-left:auto;font-size:0.6rem">0</span>
                </div>

                <div id="document-list" class="document-list">
                    <!-- Documents will be populated here -->
                </div>
            </div>

            <div class="sidebar-section">
                <div class="glass-card" style="padding:1rem;display:flex;gap:1rem;align-items:center">
                    <div style="background:#10b981;width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px #10b981">
                    </div>
                    <div style="font-size:0.8rem">
                        <div style="color:var(--text-secondary)">System Status</div>
                        <div style="font-weight:600;color:var(--text-primary)">Operational</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="hero-section">
                <h1 class="hero-title">DocsInsight Engine</h1>
                <p class="hero-subtitle">Next-Generation Document Intelligence</p>
                <div class="badges">
                    <span class="ai-badge"><i class="fas fa-brain"></i> Neural Search</span>
                    <span class="ai-badge"><i class="fas fa-bolt"></i> Real-time RAG</span>
                </div>
            </header>

            <div class="chat-container" id="chat-container">
                <div class="empty-state">
                    <div
                        style="width:80px;height:80px;background:rgba(255,255,255,0.05);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem auto;border:1px solid var(--glass-border)">
                        <i class="fas fa-wand-magic-sparkles fa-2x" style="color:var(--text-muted)"></i>
                    </div>
                    <h3>Start Exploring</h3>
                    <p style="color:var(--text-muted);margin-top:0.5rem">Upload a document and ask questions to uncover
                        insights.</p>
                </div>
                <!-- Chat messages will appear here -->
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="query-input" placeholder="Ask a question about your documents..." rows="1"></textarea>
                    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div style="text-align:center;font-size:0.7rem;color:var(--text-muted);margin-top:1rem">
                    AI can make mistakes. Please verify important information.
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
