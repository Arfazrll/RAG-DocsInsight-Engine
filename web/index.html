<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DocsInsight Engine — AI-powered document intelligence with neural search and real-time RAG.">
    <title>DocsInsight Engine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                    <div class="sidebar-title" style="margin-bottom:0">
                        <span>Documents</span>
                    </div>
                    <button id="sidebar-toggle" style="background:none;border:none;color:var(--gray-500);cursor:pointer;transition:color 0.15s;padding:4px;border-radius:4px;font-size:11px" onmouseover="this.style.color='var(--gray-200)'" onmouseout="this.style.color='var(--gray-500)'">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>

                <div class="upload-section" id="drop-zone">
                    <input type="file" id="file-upload" multiple hidden>
                    <label for="file-upload" class="upload-label">
                        <i class="fas fa-arrow-up-from-bracket"></i>
                        <div>
                            <div style="font-weight:500;color:var(--gray-200);font-size:13px">Upload files</div>
                            <div style="font-size:11px;margin-top:2px;color:var(--gray-500)">PDF, DOCX, TXT, XLSX, CSV</div>
                        </div>
                    </label>
                    <div id="upload-status" style="margin-top:8px;font-size:12px;color:var(--gray-300)"></div>
                </div>
            </div>

            <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;min-height:0">
                <div class="sidebar-title">
                    <span>Library</span>
                    <span id="doc-count" class="ai-badge" style="margin-left:auto;font-size:10px;padding:2px 7px">0</span>
                </div>
                <div id="document-list" class="document-list"></div>
            </div>

            <div class="sidebar-section">
                <div class="status-card">
                    <div class="status-dot"></div>
                    <div style="font-size:11px;color:var(--gray-500)">System operational</div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="hero-section">
                <h1 class="hero-title">DocsInsight Engine</h1>
                <div class="badges">
                    <span class="ai-badge">Neural Search</span>
                    <span class="ai-badge">RAG</span>
                    <span class="ai-badge">Local LLM</span>
                </div>
            </header>

            <div class="chat-container" id="chat-container">
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="fas fa-magnifying-glass"></i>
                    </div>
                    <h3>Ask anything about your documents</h3>
                    <p style="color:var(--gray-500);margin-top:6px;font-size:13px">Upload a document and start querying to extract insights.</p>
                    <div class="suggestion-chips">
                        <div class="suggestion-chip" data-query="Summarize the key points of the uploaded document">Summarize key points</div>
                        <div class="suggestion-chip" data-query="What are the main topics discussed?">Main topics</div>
                        <div class="suggestion-chip" data-query="Extract important data and statistics">Extract data</div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="query-input" placeholder="Ask a question..." rows="1"></textarea>
                    <button id="send-btn"><i class="fas fa-arrow-up"></i></button>
                </div>
                <div class="input-footer">
                    AI responses may be inaccurate. Verify important information.
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
